[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dayclock"
version = "0.0.0"
description = "Seasonal bird detection charts with daylight and recording gaps"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.6", "numpy>=1.23"]

[project.scripts]
dayclock = "dayclock.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
